<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e4a3c">
<title>Caffè Lunetta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="title">
  <canvas id="titlecv"></canvas>
  <div class="tbox">
    <div class="logo"><small>Via dei Tigli, 7</small><h1>Caffè Lunetta<span class="moon">☾</span></h1><p>un piccolo caffè, tante piccole vite</p></div>
    <div class="tbtns">
      <button class="tbtn main" id="bPlay">Apri il caffè</button>
      <button class="tbtn" id="bNew">Nuova partita</button>
      <button class="tbtn ghost" id="bOpt">Opzioni</button>
    </div>
  </div>
  <div class="tfoot">Prototipo · grafica</div>
</div>

<div id="app" class="hidden">
  <header id="top">
    <div class="money"><span class="coin"></span><span id="money">0 €</span></div>
    <div class="fama"><b id="famaName">Fama</b><div class="bar"><div id="famaBar"></div></div></div>
    <div class="atm" title="Atmosfera">✨ <span id="atm">0%</span></div>
    <button class="ibtn" id="bMenu" title="Menu">☰</button>
  </header>
  <div id="scenewrap"><canvas id="scene"></canvas><div class="scenehint">← trascina per girare il locale →</div></div>
  <nav id="tabs">
    <button data-t="locale" class="on"><span>☕</span>Locale</button>
    <button data-t="menu"><span>📜</span>Menu</button>
    <button data-t="lab"><span>⚗️</span>Laboratorio<i class="dot"></i></button>
    <button data-t="shop"><span>🛍️</span>Negozio</button>
    <button data-t="diario"><span>📔</span>Taccuino<i class="dot"></i></button>
  </nav>
  <section id="panel"></section>
</div>
<div id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/scene.js"></script>
<script src="js/title.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
