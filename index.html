<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05040c">
<title>Notte Fonda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Creepster&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--pw:190px;--cw:84px;--ch:108px;--mine:#3fe6ff;--enemy:#ff3f62;--fear:#b04bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05040c;color:#e9e4ff;font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#cv{position:fixed;left:0;top:0;display:block}
.hidden{display:none!important}
/* ---------- HUD ---------- */
#hud{position:fixed;left:0;top:0;right:var(--pw);height:54px;display:flex;align-items:flex-start;justify-content:space-between;padding:6px 10px;pointer-events:none;z-index:5}
.tag{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(10,8,24,.85),rgba(10,8,24,.55));border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:5px 10px;backdrop-filter:blur(4px)}
.tag .nm{font-weight:900;font-size:13px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.3px}
.tag.me .nm{color:var(--mine);text-shadow:0 0 10px rgba(63,230,255,.6)}
.tag.op .nm{color:var(--enemy);text-shadow:0 0 10px rgba(255,63,98,.6)}
.crowns{display:flex;gap:3px}
.crowns i{width:14px;height:14px;border-radius:50%;background:#1d1a2c;border:1px solid #3a3550;display:block;position:relative}
.crowns i.on{background:radial-gradient(circle at 40% 35%,#fff3c4,#ffb02a 55%,#7a3a00);border-color:#ffd36a;box-shadow:0 0 8px #ffb02a}
#clockbox{text-align:center;background:linear-gradient(180deg,rgba(10,8,24,.9),rgba(10,8,24,.5));border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:3px 14px 4px;min-width:96px}
#timer{font-family:Cinzel,serif;font-weight:900;font-size:21px;letter-spacing:1px;line-height:1.05}
#phase{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#a99cd8}
#clockbox.mid #timer{color:#ffcf5a;text-shadow:0 0 12px #ff9a2a}
#clockbox.mid #phase{color:#ffcf5a}
#clockbox.ot{border-color:#b04bff;box-shadow:0 0 18px rgba(176,75,255,.5)}
#clockbox.ot #timer{color:#e3b2ff;text-shadow:0 0 14px #b04bff}
#clockbox.ot #phase{color:#e3b2ff}
/* ---------- PANNELLO CARTE ---------- */
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--pw);z-index:6;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
 background:linear-gradient(180deg,#0c0a1c 0%,#120c26 60%,#1a0f30 100%);border-left:1px solid rgba(176,75,255,.35);box-shadow:-10px 0 30px rgba(0,0,0,.6),inset 1px 0 0 rgba(255,255,255,.04)}
#panel:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 50% at 50% 100%,rgba(176,75,255,.18),transparent 70%);pointer-events:none}
#nextwrap{display:flex;align-items:center;gap:8px;color:#9b8fc8;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:auto}
#next{width:calc(var(--cw)*.5);height:calc(var(--ch)*.5);border-radius:7px;overflow:hidden;border:2px solid #444;position:relative;opacity:.9}
#next canvas{width:100%;height:100%;display:block}
#hand{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:10px;overflow:visible;cursor:pointer;transition:transform .14s ease,filter .2s;touch-action:none}
.card .in{position:absolute;inset:0;border-radius:10px;overflow:hidden;border:2px solid var(--rc,#888);box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.6),0 0 12px var(--rg,transparent)}
.card canvas{width:100%;height:100%;display:block}
.card .nm{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:Cinzel,serif;font-weight:900;font-size:9.5px;line-height:1.05;color:#fff;text-shadow:0 1px 2px #000,0 0 6px #000;padding:0 3px}
.card .cost{position:absolute;left:-6px;top:-6px;width:26px;height:26px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:radial-gradient(circle at 35% 30%,#e7c2ff,#9a35ff 50%,#3a0b6a);border:2px solid #f0d8ff;box-shadow:0 0 10px rgba(176,75,255,.9);z-index:2}
.card .cost b{display:block;transform:rotate(45deg);text-align:center;line-height:22px;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 2px #2a0050}
.card .rar{position:absolute;right:4px;top:4px;font-size:8px;font-weight:900;letter-spacing:1px;color:var(--rc);text-shadow:0 1px 2px #000;text-transform:uppercase}
.card.poor .in{filter:grayscale(.75) brightness(.55)}
.card.poor .cost{filter:grayscale(.6) brightness(.8)}
.card.sel{transform:translateY(-8px) scale(1.04)}
.card.sel .in{border-color:#fff;box-shadow:0 0 0 2px var(--mine),0 0 22px var(--mine),0 8px 20px rgba(0,0,0,.7)}
.card.drag{opacity:.35}
.card.nope{animation:nope .3s}
.card.fresh .in{animation:fresh .45s ease-out}
.card .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(176,75,255,.22);pointer-events:none;border-radius:0 0 8px 8px}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fresh{0%{transform:rotateY(90deg) scale(.8);filter:brightness(3)}100%{transform:none;filter:none}}
.rM .in{border-image:none;animation:myth 3s linear infinite}
@keyframes myth{0%{border-color:#ff5aa8}33%{border-color:#5ad8ff}66%{border-color:#ffe15a}100%{border-color:#ff5aa8}}
#fear{position:relative;height:30px;margin-top:2px}
#fearbar{position:absolute;left:24px;right:0;top:7px;height:16px;border-radius:9px;background:#140d26;border:1px solid #3c2a66;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#fearfill{height:100%;width:50%;background:linear-gradient(90deg,#5a12b0,#b04bff 60%,#e7a6ff);box-shadow:0 0 14px #b04bff;transition:width .08s linear}
#fearbar .seg{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.55)}
#fearnum{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1d6ff,#9a35ff 52%,#300860);border:2px solid #f0d8ff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;box-shadow:0 0 14px rgba(176,75,255,.9);z-index:2;text-shadow:0 1px 2px #2a0050}
#fearlbl{position:absolute;right:6px;top:8px;font-size:9px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.75);text-transform:uppercase;pointer-events:none}
/* ---------- BANNER ---------- */
#banner{position:fixed;left:0;right:var(--pw);top:38%;text-align:center;pointer-events:none;z-index:8;opacity:0}
#banner.show{animation:ban 2.4s ease forwards}
#banner h2{margin:0;font-family:Creepster,Cinzel,serif;font-size:clamp(34px,7vw,64px);letter-spacing:3px;color:#ffd77a;text-shadow:0 0 20px #ff8a2a,0 4px 0 #3a1500}
#banner p{margin:2px 0 0;font-weight:900;letter-spacing:2px;font-size:13px;text-transform:uppercase;color:#fff;text-shadow:0 0 8px #000}
#banner.purple h2{color:#e8b8ff;text-shadow:0 0 22px #b04bff,0 4px 0 #2a0050}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
/* ---------- SCHERMATE ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden}
.nightbg{background:radial-gradient(60% 80% at 78% 10%,rgba(190,200,255,.16),transparent 60%),radial-gradient(80% 60% at 20% 100%,rgba(176,75,255,.22),transparent 70%),linear-gradient(180deg,#05040e,#0e0a22 60%,#160d2a)}
.fog{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(40% 25% at 30% 70%,rgba(140,120,200,.18),transparent 70%),radial-gradient(35% 20% at 70% 80%,rgba(120,100,190,.16),transparent 70%);filter:blur(8px);animation:fog 18s ease-in-out infinite alternate}
.fog.b{animation-duration:26s;animation-direction:alternate-reverse;opacity:.7}
@keyframes fog{0%{transform:translateX(-6%)}100%{transform:translateX(6%)}}
.moon{position:absolute;right:9%;top:8%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fffbe8,#d9d4bf 60%,#a9a48f);box-shadow:0 0 60px 20px rgba(200,210,255,.25)}
.skyline{position:absolute;left:0;right:0;bottom:0;height:34%;background:
 linear-gradient(transparent,transparent),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 100' preserveAspectRatio='none'><path d='M0 100V60h18V40h14v20h10V30h8V18h4v12h8v30h16V48h20v52h6V36l10-10 10 10v64h8V55h22v45h6V44h12V28h3v16h11v56h10V62h18V40h10v60h12V50h16v50h8V30l8-14 8 14v70h10V58h20v42h14V46h18v54h12V64h22v36z' fill='%23070611'/></svg>") bottom/100% 100% no-repeat}
.lobbybox{position:relative;z-index:2;display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1.1fr);gap:26px;width:min(900px,94vw);align-items:center}
.title{font-family:Creepster,Cinzel,serif;font-size:clamp(44px,9vw,86px);line-height:.9;margin:0;color:#eadfff;letter-spacing:4px;text-shadow:0 0 24px rgba(176,75,255,.8),0 0 2px #fff,0 6px 0 #1a0833}
.sub{margin:8px 0 18px;color:#a99cd8;font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8d80bd;font-weight:900}
input.nick{font:700 18px Inter,sans-serif;padding:12px 14px;border-radius:12px;border:1px solid #3c2a66;background:rgba(10,6,24,.8);color:#fff;outline:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.6);-webkit-user-select:text;user-select:text}
input.nick:focus{border-color:#b04bff;box-shadow:0 0 0 3px rgba(176,75,255,.25)}
.btn{font:900 15px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;border:0;border-radius:14px;padding:14px 18px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#b04bff,#6a14c8);box-shadow:0 6px 0 #3a0878,0 10px 24px rgba(176,75,255,.45);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3a0878,0 4px 12px rgba(176,75,255,.4)}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.btn.small{padding:9px 14px;font-size:12px;border-radius:10px;box-shadow:0 4px 0 #3a0878}
.rooms{background:rgba(10,6,24,.72);border:1px solid rgba(176,75,255,.25);border-radius:16px;padding:12px;max-height:62vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:pan-y}
.rooms h3{margin:2px 4px 10px;font-family:Cinzel,serif;font-size:15px;letter-spacing:2px;color:#d9ccff}
.room{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(176,75,255,.12),rgba(255,255,255,.03));margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}
.room .who{font-weight:900}
.room .when{font-size:11px;color:#8d80bd}
.empty{color:#8d80bd;font-size:13px;padding:14px 6px;text-align:center}
.badge{position:absolute;top:10px;left:12px;font-size:10px;letter-spacing:2px;font-weight:900;color:#ffcf5a;border:1px solid rgba(255,207,90,.4);padding:3px 8px;border-radius:99px;z-index:3}
.cardrow{position:absolute;left:0;right:0;bottom:-78px;display:flex;justify-content:center;gap:10px;z-index:1;opacity:.55;pointer-events:none}
.cardrow .card{transform:rotate(var(--r)) translateY(var(--y))}
.center{text-align:center;position:relative;z-index:2}
.spinner{width:64px;height:64px;margin:16px auto;border-radius:50%;border:3px solid rgba(176,75,255,.2);border-top-color:#b04bff;animation:spin 1s linear infinite;box-shadow:0 0 30px rgba(176,75,255,.4)}
@keyframes spin{to{transform:rotate(360deg)}}
#vs .names{display:flex;align-items:center;gap:30px;justify-content:center}
#vs .pl{font-family:Cinzel,serif;font-weight:900;font-size:clamp(22px,4vw,38px)}
#vs .pl small{display:block;font-family:Inter;font-size:11px;letter-spacing:2px;color:#a99cd8;text-transform:uppercase;margin-top:4px}
#vs .x{font-family:Creepster,serif;font-size:56px;color:#ffcf5a;text-shadow:0 0 20px #ff8a2a}
#vs .count{font-family:Creepster,serif;font-size:110px;line-height:1;color:#fff;text-shadow:0 0 30px #b04bff;margin-top:6px}
#vs{background:radial-gradient(circle,rgba(20,10,40,.6),rgba(5,4,12,.92))}
#end{background:radial-gradient(circle,rgba(20,10,40,.55),rgba(5,4,12,.94))}
#end h1{font-family:Creepster,serif;font-size:clamp(60px,12vw,110px);margin:0;letter-spacing:4px}
#end.win h1{color:#ffd77a;text-shadow:0 0 30px #ff9a2a,0 6px 0 #3a1500}
#end.lose h1{color:#ff7a90;text-shadow:0 0 30px #ff2a4a,0 6px 0 #3a0010}
#end.draw h1{color:#d9ccff;text-shadow:0 0 30px #b04bff}
#end .why{color:#c9bdf0;letter-spacing:1.5px;font-weight:700;margin:6px 0 16px;text-transform:uppercase;font-size:13px}
#end .score{display:flex;gap:28px;justify-content:center;margin-bottom:22px;font-weight:900}
#end .score div{display:flex;flex-direction:column;align-items:center;gap:6px}
#rotate{z-index:50;background:#05040c;flex-direction:column;gap:16px;display:none}
#rotate .ph{width:60px;height:100px;border:4px solid #b04bff;border-radius:12px;animation:rot 2s ease-in-out infinite;box-shadow:0 0 20px rgba(176,75,255,.6)}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(20,10,40,.95);border:1px solid #b04bff;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#deckinfo{font-size:11px;color:#c9bdf0;letter-spacing:.5px;margin-top:12px;background:rgba(10,6,24,.75);padding:6px 10px;border-radius:10px;border:1px solid rgba(176,75,255,.2);position:relative;z-index:3}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div class="tag me"><span class="nm" id="meName">Tu</span><span class="crowns" id="meCr"><i></i><i></i><i></i></span></div>
  <div id="clockbox"><div id="timer">3:00</div><div id="phase">Notte</div></div>
  <div class="tag op"><span class="crowns" id="opCr"><i></i><i></i><i></i></span><span class="nm" id="opName">Avversario</span></div>
</div>
<div id="panel" class="hidden">
  <div id="nextwrap"><div id="next"></div><span>Prossima</span></div>
  <div id="hand"></div>
  <div id="fear"><div id="fearnum">5</div><div id="fearbar"><div id="fearfill"></div></div><div id="fearlbl">Paura</div></div>
</div>
<div id="banner"><h2></h2><p></p></div>

<div id="lobby" class="screen nightbg">
  <div class="fog"></div><div class="fog b"></div><div class="moon"></div><div class="skyline"></div>
  <div class="badge">VERSIONE DI TEST</div>
  <div class="cardrow" id="cardrow"></div>
  <div class="lobbybox">
    <div>
      <h1 class="title">Notte<br>Fonda</h1>
      <div class="sub">Leggende metropolitane · 1 contro 1</div>
      <div class="field"><label>Il tuo nick</label><input class="nick" id="nick" maxlength="16" placeholder="Es. Cacciatore" autocomplete="off"></div>
      <button class="btn" id="btnCreate">Apri un tavolo</button>
      <div id="deckinfo"></div>
    </div>
    <div class="rooms"><h3>Tavoli aperti</h3><div id="roomlist"><div class="empty">Connessione…</div></div></div>
  </div>
</div>
<div id="wait" class="screen nightbg hidden">
  <div class="fog"></div><div class="moon"></div><div class="skyline"></div>
  <div class="center"><h2 class="title" style="font-size:44px">In attesa</h2><div class="spinner"></div><div class="sub">Il tuo tavolo è aperto. Aspettiamo uno sfidante…</div><button class="btn ghost small" id="btnCancel">Chiudi tavolo</button></div>
</div>
<div id="vs" class="screen hidden"><div class="center">
  <div class="names"><div class="pl" style="color:var(--mine)"><span id="vsMe">Tu</span><small id="vsMeDeck"></small></div><div class="x">VS</div><div class="pl" style="color:var(--enemy)"><span id="vsOp">—</span><small id="vsOpDeck">Mazzo segreto</small></div></div>
  <div class="count" id="vsCount">3</div>
</div></div>
<div id="end" class="screen hidden"><div class="center">
  <h1 id="endTitle">Vittoria</h1><div class="why" id="endWhy"></div>
  <div class="score"><div><span class="crowns" id="endMe"><i></i><i></i><i></i></span><span id="endMeN" style="color:var(--mine)"></span></div><div><span class="crowns" id="endOp"><i></i><i></i><i></i></span><span id="endOpN" style="color:var(--enemy)"></span></div></div>
  <button class="btn" id="btnBack">Torna alla lobby</button>
</div></div>
<div id="rotate" class="screen"><div class="ph"></div><div class="sub">Ruota il telefono in orizzontale</div></div>
<div id="toast"></div>

// ---------- stato ----------

function phaseOf(st) { return st.tick >= REG ? 'ot' : st.tick >= MID ? 'mid' : 'night'; }

  const s = lastSnap();
  showEnd(myTeam, 'disc', s ? s.s.d : [0, 0]);
  if (role === 'host' && db) { const id = roomId; F.remove(F.ref(db, ROOMS + '/' + id)).catch(() => {}); F.remove(F.ref(db, GAMES + '/' + id)).catch(() => {}); }
}
function cleanup() {
  for (const u of unsubs) try { u(); } catch (e) {}
  unsubs = [];
  if (hostTimer) { clearInterval(hostTimer); hostTimer = null; }
  if (db && roomId) {
    if (role === 'host') { F.remove(F.ref(db, ROOMS + '/' + roomId)).catch(() => {}); F.remove(F.ref(db, GAMES + '/' + roomId)).catch(() => {}); }
    try { F.onDisconnect(F.ref(db, ROOMS + '/' + roomId)).cancel(); F.onDisconnect(F.ref(db, GAMES + '/' + roomId)).cancel(); F.onDisconnect(F.ref(db, ROOMS + '/' + roomId + '/guestLeft')).cancel(); } catch (e) {}
  }
  st = null; bot = null; roomId = null; role = null; snaps = [];
  mode = 'lobby';
  $('#hud').classList.add('hidden'); $('#panel').classList.add('hidden');
}
function backToLobby() {
  cleanup();
  deck = NF.randomDeck(); showDeckInfo();
  show('#lobby'); layout();
  if (BOTMODE) return;
  subscribeLobby();
}

// ---------- lobby ----------
function showDeckInfo() { $('#deckinfo').textContent = 'Mazzo assegnato: ' + deck.n + ' · ' + deck.d.map(k => NF.CARDS[k].n).join(', '); }
function getNick() {
  const v = $('#nick').value.trim().slice(0, 16);
  if (!v) { toast('Scegli un nick'); $('#nick').focus(); return null; }
  localStorage.setItem('nf_nick', v); return v;
}
async function net() {
  if (db) return true;
  try {
    const app = await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`);
    F = await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-database.js`);
    const fapp = app.initializeApp(CFG);
    db = F.getDatabase(fapp);
    return true;
  } catch (e) { console.error(e); $('#roomlist').innerHTML = '<div class="empty">Impossibile collegarsi a Firebase.</div>'; return false; }
}
function ago(ts) { const s = Math.max(0, (Date.now() - ts) / 1000 | 0); return s < 60 ? 'adesso' : Math.floor(s / 60) + ' min fa'; }
let roomsData = {};
function renderRooms() {
  const box = $('#roomlist');
  const list = Object.entries(roomsData || {}).filter(([, r]) => r && r.status === 'open' && !r.guest && (!r.created || Date.now() - r.created < 30 * 60 * 1000)).sort((a, b) => (b[1].created || 0) - (a[1].created || 0));
  if (!list.length) { box.innerHTML = '<div class="empty">Nessun tavolo aperto.<br>Aprine uno e aspetta uno sfidante!</div>'; return; }
  box.innerHTML = '';
  for (const [id, r] of list) {
    const d = document.createElement('div'); d.className = 'room';
    const info = document.createElement('div');
    const who = document.createElement('div'); who.className = 'who'; who.textContent = r.host || '???';
    const when = document.createElement('div'); when.className = 'when'; when.textContent = 'Tavolo aperto ' + ago(r.created || Date.now());
    info.appendChild(who); info.appendChild(when);
    const b = document.createElement('button'); b.className = 'btn small'; b.textContent = 'Unisciti';
    b.onclick = () => joinRoom(id);
    d.appendChild(info); d.appendChild(b); box.appendChild(d);
  }
}
async function subscribeLobby() {
  if (!(await net())) return;
  if (lobbyUnsub) lobbyUnsub();
  lobbyUnsub = F.onValue(F.ref(db, ROOMS), (s) => { roomsData = s.val() || {}; renderRooms(); }, (err) => { $('#roomlist').innerHTML = '<div class="empty">Accesso negato al database.<br>Controlla le regole del Realtime Database.</div>'; console.error(err); });
}
setInterval(() => { if (mode === 'lobby' && !BOTMODE) renderRooms(); }, 20000);
async function createRoom() {
  const n = getNick(); if (!n) return; nick = n;
  if (BOTMODE) { oppNick = 'Bot'; startMatch('host'); return; }
  if (!(await net())) return;
  const r = F.push(F.ref(db, ROOMS)); roomId = r.key; role = 'host';
  try { await F.set(r, { host: nick, status: 'open', created: F.serverTimestamp() }); } catch (e) { toast('Errore: permessi del database'); roomId = null; return; }
  F.onDisconnect(r).remove(); F.onDisconnect(F.ref(db, GAMES + '/' + roomId)).remove();
  mode = 'wait'; show('#wait');
  unsubs.push(F.onValue(F.ref(db, ROOMS + '/' + roomId + '/guest'), (s) => {
    const g = s.val();
    if (g && mode === 'wait') {
      oppNick = g;
      unsubs.push(F.onValue(F.ref(db, ROOMS + '/' + roomId + '/guestLeft'), (x) => { if (x.val()) forceDisconnectWin(); }));
      unsubs.push(F.onChildAdded(F.ref(db, GAMES + '/' + roomId + '/cmd'), (c) => {
        const v = c.val(); if (v && NF.CARDS[v.c]) remoteCmds.push({ team: 1, card: v.c, x: +v.x, y: +v.y });
        F.remove(c.ref).catch(() => {});
      }));
      startMatch('host');
    }
  }));
}
async function joinRoom(id) {
  const n = getNick(); if (!n) return; nick = n;
  if (!(await net())) return;
  let res;
  try {
    res = await F.runTransaction(F.ref(db, ROOMS + '/' + id), (cur) => {
      if (!cur || cur.status !== 'open' || cur.guest) return;
      cur.guest = nick; cur.status = 'playing'; return cur;
    });
  } catch (e) { toast('Tavolo non disponibile'); return; }
  const v = res && res.snapshot.val();
  if (!res || !res.committed || !v || v.guest !== nick) { toast('Tavolo già occupato'); return; }
  roomId = id; oppNick = v.host || 'Host';
  F.onDisconnect(F.ref(db, ROOMS + '/' + id + '/guestLeft')).set(true);
  unsubs.push(F.onValue(F.ref(db, GAMES + '/' + id + '/s'), (s) => { const val = s.val(); if (val) pushSnap(val, performance.now()); }));
  unsubs.push(F.onValue(F.ref(db, ROOMS + '/' + id + '/status'), (s) => { if (s.val() === null && mode === 'game' && !ended) forceDisconnectWin(); }));
  startMatch('guest');
}
$('#btnCreate').onclick = createRoom;
$('#btnCancel').onclick = () => backToLobby();
$('#btnBack').onclick = () => backToLobby();
$('#nick').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });

// vetrina carte nella lobby
function lobbyCards() {
  const row = $('#cardrow'); row.innerHTML = '';
  const keys = NF.shuffle(['krampus', 'dama', 'alto', 'llorona', 'kuchi', 'moth', 'cane', 'baba', 'wendi', 'muna']).slice(0, 6);
  keys.forEach((k, i) => { const el = makeCardEl(k, 96, 124); el.style.width = '96px'; el.style.height = '124px'; el.style.setProperty('--r', ((i - 2.5) * 6) + 'deg'); el.style.setProperty('--y', (Math.abs(i - 2.5) * 10) + 'px'); row.appendChild(el); });
}

// ---------- avvio ----------
$('#nick').value = localStorage.getItem('nf_nick') || '';
deck = NF.randomDeck(); showDeckInfo();
layout();
lobbyCards();
if (BOTMODE) { $('#roomlist').innerHTML = '<div class="empty">Modalità bot: premi "Apri un tavolo" per giocare contro il computer.</div>'; if (P.has('auto')) { $('#nick').value = $('#nick').value || 'Tester'; createRoom(); } }
else subscribeLobby();
window.__nf = { get st() { return st; }, get hand() { return hand; }, tryPlay, get M() { return buildModel(performance.now()); } };
</script>
</body>
